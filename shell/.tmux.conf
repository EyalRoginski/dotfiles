unbind r
bind r source-file ~/.tmux.conf

unbind c
bind c new-window -c "#{session_path}"
bind | split-window -h -c "#{session_path}"
bind - split-window -v -c "#{session_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g prefix C-s

# Fix weird characters appearing: https://github.com/microsoft/WSL/issues/5931
set -sg escape-time 50

# Fix neovim changing color scheme
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",alacritty:RGB"

# # List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-sessionx'

# Sessionizer: prefix + O. Uses fzf's own popup, so it doesn't need the fzf-tmux script.
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-custom-paths-subdirectories 'true'
# Ctrl-x in the picker lists the directories directly under $HOME, like ~/dotfiles
set -g @sessionx-x-path "$HOME"
# Offer projects from whichever of these directories exist on this machine
run 'tmux set -g @sessionx-custom-paths "$(for d in projects work sources programs; do [ -d "$HOME/$d" ] && printf "%s," "$HOME/$d"; done)"'

set -g mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# Use wl-copy where it's available (NixOS on Wayland), and xclip otherwise
if-shell 'command -v wl-copy' \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'" \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"
# Dracula config
set -g @dracula-show-powerline true
# set -g @dracula-show-flags false
set -g @dracula-show-left-icon session
# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, kubernetes-context, synchronize-panes
set -g @dracula-plugins "time git battery"
set -g @dracula-show-timezone false
set -g @dracula-military-time true
set -g @dracula-show-empty-plugins false
set -g status-position top


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
